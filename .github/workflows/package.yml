name: Package and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - name: Enable Corepack
        run: npm install --global corepack --force && corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Validate
        run: yarn check && yarn lint && yarn format:check
      - name: Verify checked-in sources
        run: git diff --exit-code
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node --print "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Pack tested release
        run: |
          mkdir -p package
          yarn pack --out package/zynosuite-sdk.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan committed lockfile
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:latest scan source --recursive /src

  release:
    name: Publish approved tag
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, security]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: package
      - name: Publish tested archive using npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="package/zynosuite-sdk.tgz"
          VERSION="$(tar -xOf "$ARCHIVE" package/package.json | node --input-type=module --eval "let value=''; for await (const chunk of process.stdin) value += chunk; process.stdout.write(JSON.parse(value).version)")"
          if npm view "@zyno-io/zynosuite-sdk@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "Version $VERSION is already published."
          else
            npm publish "$ARCHIVE" --access public --provenance
          fi
      - name: Attach tested package to GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" package/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" package/*.tgz --verify-tag --generate-notes
          fi

name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - run: npm install --global corepack --force && corepack enable
      - run: yarn install --immutable
      - uses: actions/configure-pages@v5
      - name: Generate API reference and build VitePress
        run: yarn docs:build && yarn docs:check
      - name: Verify checked-in sources
        run: git diff --exit-code
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
